name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  suites:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [Repository build and tests, Four-service native successor]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          check-latest: false

      - name: Validate release wrapper shell syntax
        if: matrix.suite == 'Repository build and tests'
        run: sh -n scripts/provider-documentation-factory-release.sh

      - name: Run go vet
        if: matrix.suite == 'Repository build and tests'
        run: go vet ./...

      - name: Build all packages
        if: matrix.suite == 'Repository build and tests'
        run: go build ./...

      - name: Run suite including historical mapping generations
        if: matrix.suite == 'Repository build and tests'
        run: go test -p 1 -count=1 -timeout 30m -skip '^TestCloudMappingNeutralSuccessorReachRealFactoryVerify$' ./...
      - name: Compile and verify all nine successor operation packages
        if: matrix.suite == 'Four-service native successor'
        run: go test -p 1 -count=1 -timeout 30m -run '^TestCloudMappingNeutralSuccessorReachRealFactoryVerify$' ./internal/providerplan

  test:
    name: Build & Test
    needs: suites
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both suites on this revision
        env:
          SUITES_RESULT: ${{ needs.suites.result }}
        run: test "$SUITES_RESULT" = success
